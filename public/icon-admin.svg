<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Administrar precios">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="red" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff1a26"/>
      <stop offset="100%" stop-color="#E30613"/>
    </linearGradient>
  </defs>
  <!-- Fondo carbón -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="#E30613" stroke-width="6" opacity="0.35"/>

  <!-- Barras de precios (fondo) -->
  <g fill="#ffffff" opacity="0.92">
    <rect x="118" y="300" width="52" height="118" rx="14"/>
    <rect x="198" y="252" width="52" height="166" rx="14"/>
    <rect x="278" y="218" width="52" height="200" rx="14"/>
    <rect x="358" y="268" width="52" height="150" rx="14"/>
  </g>
  <!-- Acento rojo en barra principal -->
  <rect x="278" y="218" width="52" height="200" rx="14" fill="url(#red)"/>

  <!-- Símbolo $ en barra central -->
  <text x="304" y="340" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="72" font-weight="800" fill="#ffffff">$</text>

  <!-- Candado premium (admin) -->
  <g transform="translate(256 168)">
    <rect x="-72" y="8" width="144" height="112" rx="22" fill="url(#red)"/>
    <path
      d="M -44 8 V -8 a 44 44 0 0 1 88 0 V 8"
      fill="none"
      stroke="#ffffff"
      stroke-width="20"
      stroke-linecap="round"
    />
    <circle cx="0" cy="58" r="14" fill="#ffffff"/>
    <rect x="-8" y="58" width="16" height="36" rx="8" fill="#ffffff"/>
  </g>

  <!-- Badge ADMIN -->
  <rect x="156" y="72" width="200" height="44" rx="22" fill="#E30613"/>
  <text x="256" y="104" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="26" font-weight="800" letter-spacing="0.12em" fill="#ffffff">ADMIN</text>
</svg>
