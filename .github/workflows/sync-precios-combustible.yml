name: Sync precios combustible

on:
  schedule:
    # ~07:00 hora Mazatlán (variación por horario de verano; ajustar si hace falta)
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Exportar leyenda Mazatlán (GITHUB_ENV)
        run: |
          node scripts/sync-precios-combustible.mjs --write-github-env
          echo "PREC_SYNC_FECHA_ACTUALIZACION=${{ env.PREC_SYNC_FECHA_ACTUALIZACION }}" >> $GITHUB_ENV
          echo "PREC_SYNC_HORA_ACTUALIZACION=${{ env.PREC_SYNC_HORA_ACTUALIZACION }}" >> $GITHUB_ENV
      - name: Ejecutar sincronización
        # No re-declarar PREC_SYNC_* con ${{ env.* }}: puede vaciar el entorno del paso.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-precios-combustible.mjs
